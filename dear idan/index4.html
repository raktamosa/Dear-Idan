<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<title>Dear Idan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body data-page="4">
<main class="stage">
  <section class="content">
    <h1 class="title">Boleh aku bicara langsung?</h1>
    <div class="rule"></div>
    <div class="card answer">
      <p class="small">Aku cuma mau bilang sekali lagi:</p>
      <p class="big">Maukah sayang<br>maafin aku?</p>
      <svg class="heart mid" viewBox="-8 -8 16 16" aria-hidden="true"><path d="M0 6.5C-7 1.5-6.5-5-3-5C-1.2-5 0-3.8 0-2.5C0-3.8 1.2-5 3-5C6.5-5 7 1.5 0 6.5Z"/></svg>
    </div>
    <div class="actions stack">
      <button class="btn btn-yes" type="button">Iya, aku maafin</button>
      <button class="btn btn-wait" type="button">ngga aku maafin</button>
    </div>
    <p class="fine">apa pun jawabannya, aku bakal terima kok sayang.</p>
  </section>
  <div class="popup" aria-hidden="true">
    <div class="popup-box" role="dialog" aria-modal="true">
      <button class="popup-close" type="button" aria-label="tutup"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5L9.5 9.5M9.5 2.5L2.5 9.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <span class="popup-badge"><svg class="heart" viewBox="-8 -8 16 16" aria-hidden="true"><path d="M0 6.5C-7 1.5-6.5-5-3-5C-1.2-5 0-3.8 0-2.5C0-3.8 1.2-5 3-5C6.5-5 7 1.5 0 6.5Z"/></svg></span>
      <h2 class="popup-title">Yeayyy!</h2>
      <p class="popup-text">Terima kasih sayang,<br>boleh chat aku sayang?</p>
      <a class="pop-btn" href="https://wa.me/6281234567890" target="_blank" rel="noopener">Chat aku disini sayang
        <svg class="heart" viewBox="-8 -8 16 16" aria-hidden="true"><path d="M0 6.5C-7 1.5-6.5-5-3-5C-1.2-5 0-3.8 0-2.5C0-3.8 1.2-5 3-5C6.5-5 7 1.5 0 6.5Z"/></svg>
      </a>
    </div>
  </div>
</main>
